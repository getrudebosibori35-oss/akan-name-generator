<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<!--Body section-->
<body>

    <h1>Akan Name Generator</h1>

    <p>Enter your birthday and gender to find your Akan name.</p>
<!-- User input form -->
    <form id="akanForm">

        <label for="day">Day:</label>
        <input type="number" id="day" min="1" max="31" required>

        <br><br>

        <label for="month">Month:</label>
        <input type="number" id="month" min="1" max="12" required>

        <br><br>

        <label for="year">Year:</label>
        <input type="number" id="year" required>

        <br><br>

        <label>Gender:</label>

        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">

        <br><br>

        <button type="submit">Generate My Akan Name</button>
    </form>
<!-- Results section -->
    <div id="result"></div>

    <script src="script.js"></script>
</body>

</html>
